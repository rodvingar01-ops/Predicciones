name: ETL Apuestas Diario
on:
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch: 

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install pandas requests scipy

      - name: Ejecutar motor de extracción
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python updater.py

      - name: Guardar la nueva base de datos
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Matches.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática de resultados" && git push)
